<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {% if page.title %}
        {{ page.title }}{% unless page.title == site.title %} - {{ site.title }}{% endunless %}
      {% else %}
        {{ site.title }}
      {% endif %}
    </title>
    <link rel="stylesheet" href="{{ "/style.css" | relative_url }}">
  </head>
  <body>
    <div class="wrapper">
      <a class="skip-link" href="#content">Skip to content</a>
      <header class="site-header">
        <div class="site-brand">
          <a class="site-logo" href="{{ "/" | relative_url }}">{{ site.title }}</a>
          {% if site.description %}
            <span class="site-tagline">{{ site.description }}</span>
          {% endif %}
        </div>
        <nav class="site-nav" aria-label="Primary">
          <a href="{{ "/" | relative_url }}" {% if page.url == "/" %}aria-current="page"{% endif %}>Home</a>
          <a href="{{ "/about/" | relative_url }}" {% if page.url == "/about/" %}aria-current="page"{% endif %}>About</a>
        </nav>
      </header>
      <main class="site-main" id="content">
        {{ content }}
      </main>
      <footer class="site-footer">
        {% if site.description %}
          <p class="site-footer-tagline">{{ site.description }}</p>
        {% endif %}
        <p class="site-footer-note">(c) {{ site.title }} - {{ site.time | date: "%Y" }}</p>
      </footer>
    </div>
  </body>
</html>
